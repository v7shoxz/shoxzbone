<!DOCTYPE html><html lang="pt-BR"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>Torneios — Tournament X</title>  <link rel="stylesheet" href="/web/style.css"/><link rel="stylesheet" href="/web/animations.css" />  <style>    .tours-page { max-width: 1200px; margin: 0 auto; padding: 90px 24px 60px; }    .tours-header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 32px; }    .tours-header h1 { font-size: 36px; font-weight: 900; color: #fff; }    .tours-header p { color: #6b7280; font-size: 14px; margin-top: 4px; }    .tours-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }    .filter-chip { padding: 7px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid #1e2535; background: #0d1117; color: #6b7280; cursor: pointer; transition: all .2s; }    .filter-chip:hover { color: #fff; border-color: #2a3550; }    .filter-chip.active { background: rgba(59,130,246,.12); border-color: rgba(59,130,246,.3); color: #60a5fa; }    .tours-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }    .tour-card { background: #0d1117; border: 1px solid #1a2035; border-radius: 20px; overflow: hidden; transition: border-color .2s, transform .2s; }    .tour-card:hover { border-color: #2a3550; transform: translateY(-2px); }    .tour-card-banner { height: 130px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }    .tour-card-banner img { width: 100%; height: 100%; object-fit: cover; }    .tour-card-banner .no-img { font-size: 48px; }    .tour-card-banner-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(13,17,23,.9) 0%, transparent 60%); }    .tour-card-status { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; border: 1px solid; }    .s-open { background: rgba(16,185,129,.12); color: #34d399; border-color: rgba(16,185,129,.25); }    .s-live { background: rgba(139,92,246,.12); color: #a78bfa; border-color: rgba(139,92,246,.25); }    .s-closed { background: rgba(107,114,128,.12); color: #9ca3af; border-color: rgba(107,114,128,.25); }    .s-finished { background: rgba(59,130,246,.12); color: #60a5fa; border-color: rgba(59,130,246,.25); }    .s-canceled { background: rgba(239,68,68,.12); color: #f87171; border-color: rgba(239,68,68,.25); }    .s-pending { background: rgba(245,158,11,.12); color: #fbbf24; border-color: rgba(245,158,11,.25); }    .tour-card-body { padding: 14px 16px; }    .tour-card-name { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }    .tour-card-meta { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }    .tour-card-meta span { font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 5px; }    .tour-card-bar-wrap { }    .tour-card-bar-top { display: flex; justify-content: space-between; font-size: 11px; color: #4b5563; margin-bottom: 5px; }    .tour-card-bar { height: 5px; background: #1a2035; border-radius: 3px; overflow: hidden; }    .tour-card-fill { height: 100%; border-radius: 3px; transition: width .4s; }    .tours-empty { text-align: center; padding: 80px 24px; color: #374151; grid-column: 1/-1; }    .tours-empty div { font-size: 48px; margin-bottom: 12px; }    .tours-pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 32px; }    .page-btn { background: #0d1117; border: 1px solid #1a2035; color: #9ca3af; padding: 8px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .2s; }    .page-btn:hover:not(:disabled) { border-color: #3b82f6; color: #60a5fa; }    .page-btn:disabled { opacity: .3; cursor: not-allowed; }    .page-info { font-size: 13px; color: #4b5563; padding: 0 8px; }    .search-wrap { position: relative; }    .search-wrap input { background: #0d1117; border: 1px solid #1a2035; border-radius: 12px; padding: 10px 16px 10px 38px; color: #fff; font-size: 14px; outline: none; width: 240px; transition: border-color .2s; }    .search-wrap input:focus { border-color: #3b82f6; }    .search-wrap input::placeholder { color: #4b5563; }    .search-wrap .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #4b5563; font-size: 14px; }  </style></head><body style="background:#080c18">  <nav class="navbar">    <div class="nav-inner">      <a href="/" class="logo">Tournament <span class="badge">X</span></a>      <div class="nav-links">        <a href="/" class="nav-link">Home</a>      </div>      <div class="nav-right"><div id="userArea"></div></div>      <button class="hamburger" onclick="toggleMenu()">&#9776;</button>    </div>  </nav>  <div class="tours-page">    <div class="tours-header">      <div>        <h1>Torneios</h1>        <p id="totalLabel">Carregando...</p>      </div>      <div class="search-wrap">        <span class="search-icon">🔍</span>        <input id="searchInput" placeholder="Buscar torneio..." oninput="onSearch()" />      </div>    </div>    <div class="tours-filters">      <div class="filter-chip active" onclick="setFilter(this, null)">Todos</div>      <div class="filter-chip" onclick="setFilter(this, 1)">🟢 Abertos</div>      <div class="filter-chip" onclick="setFilter(this, 5)">🔴 Ao Vivo</div>      <div class="filter-chip" onclick="setFilter(this, 0)">⏳ Em Breve</div>      <div class="filter-chip" onclick="setFilter(this, 3)">✅ Finalizados</div>    </div>    <div class="tours-grid" id="grid">      <div class="tours-empty"><div>⏳</div><p>Carregando torneios...</p></div>    </div>    <div class="tours-pagination" id="pagination" style="display:none">      <button class="page-btn" id="btnPrev" onclick="changePage(-1)">← Anterior</button>      <span class="page-info" id="pageInfo"></span>      <button class="page-btn" id="btnNext" onclick="changePage(1)">Próximo →</button>    </div>  </div>  <script src="/web/app.js"></script>  <script>    let currentFilter = null;    let currentPage = 1;    let totalPages = 1;    let searchTimeout = null;    const STATUS_CLASS = { 0: "s-pending", 1: "s-open", 2: "s-closed", 3: "s-finished", 4: "s-canceled", 5: "s-live" };    const STATUS_LABEL = { 0: "Em Breve", 1: "Aberto", 2: "Fechado", 3: "Finalizado", 4: "Cancelado", 5: "Ao Vivo" };    const REGION_LABEL = { sa: "América do Sul", us: "América do Norte", eu: "Europa", asia: "Ásia", tr: "Oriente Médio", usw: "EUA Oeste", ussc: "América Central", in: "Índia" };    function setFilter(el, status) {      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));      el.classList.add("active");      currentFilter = status;      currentPage = 1;      load();    }    function onSearch() {      clearTimeout(searchTimeout);      searchTimeout = setTimeout(() => { currentPage = 1; load(); }, 350);    }    function changePage(dir) {      currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));      load();      window.scrollTo({ top: 0, behavior: "smooth" });    }    async function load() {      const grid = document.getElementById("grid");      grid.innerHTML = `<div class="tours-empty"><div>⏳</div><p>Carregando...</p></div>`;      const params = new URLSearchParams({ page: currentPage, limit: 20 });      if (currentFilter !== null) params.set("status", currentFilter);      const res = await fetch("/web/public/tournaments?" + params);      const data = await res.json();      const list = data.tournaments || [];      const search = document.getElementById("searchInput").value.toLowerCase();      const filtered = search ? list.filter(t => t.name.toLowerCase().includes(search)) : list;      totalPages = data.pages || 1;      document.getElementById("totalLabel").textContent = `${data.total} torneio${data.total !== 1 ? "s" : ""} encontrado${data.total !== 1 ? "s" : ""}`;      const pag = document.getElementById("pagination");      if (totalPages > 1) {        pag.style.display = "flex";        document.getElementById("pageInfo").textContent = `Página ${currentPage} de ${totalPages}`;        document.getElementById("btnPrev").disabled = currentPage === 1;        document.getElementById("btnNext").disabled = currentPage === totalPages;      } else {        pag.style.display = "none";      }      if (!filtered.length) {        grid.innerHTML = `<div class="tours-empty"><div>🏆</div><p>Nenhum torneio encontrado</p></div>`;        return;      }      grid.innerHTML = filtered.map(t => {        const pct = t.maxInvites > 0 ? Math.round((t.currentInvites / t.maxInvites) * 100) : 0;        const color = t.color?.replace("#", "") || "3b82f6";        const fillColor = "#" + color;        const statusCls = STATUS_CLASS[t.status] ?? "s-pending";        const statusLbl = STATUS_LABEL[t.status] ?? "Desconhecido";        const region = REGION_LABEL[t.region] || t.region?.toUpperCase() || "—";        const startTs = Math.floor(new Date(t.startTime).getTime() / 1000);        return `          <div class="tour-card">            <div class="tour-card-banner">              ${t.image                ? `<img src="${t.image}" alt="${t.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="no-img" style="display:none"><img src="https://cdn.discordapp.com/emojis/1497725962245115954.png" width="56" height="56" /></div>`                : `<div class="no-img"><img src="https://cdn.discordapp.com/emojis/1497725962245115954.png" width="56" height="56" /></div>`              }              <div class="tour-card-banner-overlay"></div>              <div class="tour-card-status ${statusCls}">${statusLbl}</div>            </div>            <div class="tour-card-body">              <div class="tour-card-name">${t.name}</div>              <div class="tour-card-meta">                <span>🗓️ <t:${startTs}:R> <span style="color:#374151">·</span> <time data-ts="${startTs}"></time></span>                <span>🌐 ${region}</span>                <span>🔖 ${t.id}</span>              </div>              <div class="tour-card-bar-wrap">                <div class="tour-card-bar-top">                  <span>👥 ${t.currentInvites} / ${t.maxInvites} inscritos</span>                  <span>${pct}%</span>                </div>                <div class="tour-card-bar">                  <div class="tour-card-fill" style="width:${pct}%;background:${fillColor}"></div>                </div>              </div>            </div>          </div>`;      }).join("");      // Format timestamps      document.querySelectorAll("time[data-ts]").forEach(el => {        const ts = parseInt(el.getAttribute("data-ts")) * 1000;        el.textContent = new Intl.DateTimeFormat("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }).format(new Date(ts));      });    }    load();  </script></body></html>
