 ´╗┐<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Card Generator ÔÇö Tournament X</title><link rel="stylesheet" href="/web/style.css"/><link rel="stylesheet" href="/web/animations.css"/><link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet"/><style>body{background:#080c18;min-height:100vh;}.cg-wrap{max-width:1100px;margin:0 auto;padding:90px 24px 60px;display:grid;grid-template-columns:1fr 420px;gap:32px;align-items:start;}/* Preview */.cg-preview{position:sticky;top:90px;display:flex;flex-direction:column;align-items:center;gap:12px;}canvas{border-radius:16px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.8);}.cg-actions{display:flex;gap:10px;width:100%;max-width:420px;}.btn-save{flex:1;background:#ef4444;color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}.btn-save:hover{background:#dc2626;}/* Tabs */.cg-panel{display:flex;flex-direction:column;gap:0;}.tab-bar{display:flex;background:#0d1117;border:1px solid #1a2035;border-radius:12px 12px 0 0;overflow:hidden;}.tab-btn{flex:1;padding:12px 6px;font-size:11px;font-weight:700;color:#6b7280;background:none;border:none;cursor:pointer;letter-spacing:.05em;transition:all .2s;border-bottom:2px solid transparent;}.tab-btn.active{color:#fff;background:#111827;border-bottom-color:#3b82f6;}.tab-content{background:#0d1117;border:1px solid #1a2035;border-top:none;border-radius:0 0 12px 12px;padding:16px;display:none;}.tab-content.active{display:block;}/* Controls */.ctrl{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}.ctrl:last-child{margin-bottom:0;}.ctrl label{font-size:11px;color:#6b7280;font-weight:600;}.ctrl input[type=text],.ctrl input[type=url],.ctrl select{background:#111827;border:1px solid #1a2035;border-radius:8px;padding:8px 10px;color:#fff;font-size:13px;outline:none;width:100%;}.ctrl input:focus,.ctrl select:focus{border-color:#3b82f6;}.ctrl input[type=color]{height:36px;padding:3px 6px;cursor:pointer;border-radius:8px;width:100%;}.ctrl input[type=range]{width:100%;accent-color:#3b82f6;cursor:pointer;}.ctrl-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}.upload-box{display:flex;align-items:center;justify-content:center;gap:8px;background:#111827;border:2px dashed #2a3550;border-radius:10px;padding:18px;cursor:pointer;color:#6b7280;font-size:13px;transition:all .2s;text-align:center;}.upload-box:hover{border-color:#3b82f6;color:#60a5fa;}/* BG colors */.bg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px;}.bg-swatch{width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .15s;}.bg-swatch.sel{border-color:#fff;transform:scale(1.08);}/* Emotes */.emote-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:260px;overflow-y:auto;}.emote-item{aspect-ratio:1;border-radius:12px;border:2px solid #1a2035;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#111827;transition:all .15s;overflow:hidden;padding:4px;}.emote-item img{width:80%;height:80%;object-fit:contain;}.emote-item.sel{border-color:#3b82f6;background:rgba(59,130,246,.15);}.emote-item.placed{border-color:#34d399;background:rgba(52,211,153,.1);}.slot-list{display:flex;flex-direction:column;gap:8px;margin-top:8px;}.slot-item{background:#111827;border:1px solid #1a2035;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;}.slot-item img{width:32px;height:32px;object-fit:contain;}.slot-item span{flex:1;font-size:13px;color:#9ca3af;}.slot-item button{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.2);color:#f87171;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;}.add-slot-btn{width:100%;background:#1a2035;border:1px dashed #2a3550;color:#6b7280;padding:10px;border-radius:10px;font-size:13px;cursor:pointer;margin-top:8px;transition:all .2s;}.add-slot-btn:hover{border-color:#3b82f6;color:#60a5fa;}.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}.toggle{position:relative;width:38px;height:20px;}.toggle input{opacity:0;width:0;height:0;}.toggle-slider{position:absolute;inset:0;background:#1a2035;border-radius:20px;cursor:pointer;transition:.2s;}.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#4b5563;border-radius:50%;transition:.2s;}.toggle input:checked+.toggle-slider{background:#3b82f6;}.toggle input:checked+.toggle-slider:before{transform:translateX(18px);background:#fff;}@media(max-width:800px){.cg-wrap{grid-template-columns:1fr}.cg-preview{position:static}}</style></head><body><nav class="navbar"><div class="nav-inner"><a href="/" class="logo">Tournament <span class="badge">X</span></a><div class="nav-right"><div id="userArea"></div></div></div></nav><div class="cg-wrap"><div class="cg-preview"><canvas id="canvas" width="800" height="800"></canvas><div class="cg-actions"><button class="btn-save" onclick="download()"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> SAVE PNG</button><button class="btn-save" onclick="saveToInventory()" style="background:#3b82f6;"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg> SAVE TO SITE</button></div></div><div class="cg-panel"><div class="tab-bar"><button class="tab-btn active" onclick="switchTab('photo',this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>PHOTO</button><button class="tab-btn" onclick="switchTab('details',this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>DETAILS</button><button class="tab-btn" onclick="switchTab('emotes',this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>EMOTES</button><button class="tab-btn" onclick="switchTab('background',this)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M9 21V9"/></svg>BACKGROUND</button></div><div class="tab-content active" id="tab-photo"><label class="upload-box" for="playerImg">&#128444;&#65039; SELECT PHOTO<input type="file" id="playerImg" accept="image/*" style="display:none" onchange="loadFile(this,'player')"/></label><div class="ctrl" style="margin-top:10px"><label>Or URL</label><input type="url" id="playerUrl" placeholder="https://..." oninput="loadUrl(this.value,'player')"/></div><div class="ctrl"><label>Photo size</label><input type="range" id="photoSize" min="200" max="600" value="420" oninput="render()"/></div><div class="ctrl"><label>Photo Y position</label><input type="range" id="photoY" min="-100" max="100" value="0" oninput="render()"/></div></div><div class="tab-content" id="tab-details"><div class="ctrl"><label>Name / Title</label><input type="text" id="dName" value="you name" oninput="render()"/></div><div class="ctrl"><label>Font size</label><input type="range" id="dSize" min="28" max="100" value="60" oninput="render()"/></div><div class="toggle-row"><span style="font-size:11px;color:#6b7280;font-weight:600">Gradient text</span><label class="toggle"><input type="checkbox" id="useGrad" onchange="toggleGrad()"/><span class="toggle-slider"></span></label></div><div id="gradOpts" style="display:none"><div class="ctrl-2"><div class="ctrl"><label>Color 1</label><input type="color" id="g1" value="#ff6b6b" oninput="render()"/></div><div class="ctrl"><label>Color 2</label><input type="color" id="g2" value="#ffd93d" oninput="render()"/></div></div><div class="ctrl"><label>Angle</label><input type="range" id="gAngle" min="0" max="360" value="135" oninput="render()"/></div></div><div id="solidOpts"><div class="ctrl"><label>Text color</label><input type="color" id="dColor" value="#ffffff" oninput="render()"/></div></div><div class="ctrl-2"><div class="ctrl"><label>Stroke color</label><input type="color" id="sColor" value="#000000" oninput="render()"/></div><div class="ctrl"><label>Stroke size</label><input type="range" id="sSize" min="0" max="20" value="8" oninput="render()"/></div></div><div class="ctrl"><label>Discord text</label><input type="text" id="dDiscord" value="discord.gg/sgprix" oninput="render()"/></div><div class="ctrl"><label>Map (ex: Block Dash)</label><input type="text" id="dMap" value="" placeholder="Block Dash" oninput="render()"/></div><div class="ctrl"><label>Mode (ex: 2v2)</label><input type="text" id="dMode" value="" placeholder="2v2" oninput="render()"/></div><div class="ctrl-2"><div class="ctrl"><label>Map/Mode color</label><input type="color" id="dMapColor" value="#ffffff" oninput="render()"/></div><div class="ctrl"><label>Map/Mode stroke</label><input type="range" id="dMapStroke" min="0" max="20" value="6" oninput="render()"/></div></div><div class="ctrl-2"><div class="ctrl"><label>Map font size</label><input type="range" id="dMapSize" min="20" max="80" value="44" oninput="render()"/></div><div class="ctrl"><label>Mode font size</label><input type="range" id="dModeSize" min="16" max="70" value="36" oninput="render()"/></div></div><div class="ctrl"><label>Logo (bottom left URL)</label><input type="url" id="dLogo" placeholder="https://..." oninput="loadUrl(this.value,'logo')"/></div></div><div class="tab-content" id="tab-emotes"><div class="ctrl-2" style="margin-bottom:16px"><div class="ctrl"><label>Box color</label><input type="color" id="slotColor" value="#1a8fe8" oninput="render()"/></div><div class="ctrl"><label>Box size</label><input type="range" id="slotSize" min="50" max="160" value="90" oninput="updateSlotSizes()"/></div></div><div class="ctrl-2" style="margin-bottom:16px"><div class="ctrl"><label>Corner radius</label><input type="range" id="slotRadius" min="0" max="50" value="35" oninput="render()"/></div></div><div class="ctrl" style="margin-bottom:16px"><label>Max emotes</label><div style="display:flex;gap:8px;margin-top:4px"><button id="maxBtn2" onclick="setMaxSlots(2)" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #3b82f6;background:rgba(59,130,246,.15);color:#60a5fa;font-weight:700;font-size:13px;cursor:pointer;">2</button><button id="maxBtn3" onclick="setMaxSlots(3)" style="flex:1;padding:10px;border-radius:8px;border:1px solid #1a2035;background:#111827;color:#6b7280;font-weight:700;font-size:13px;cursor:pointer;">3</button><button id="maxBtn4" onclick="setMaxSlots(4)" style="flex:1;padding:10px;border-radius:8px;border:1px solid #1a2035;background:#111827;color:#6b7280;font-weight:700;font-size:13px;cursor:pointer;">4</button></div></div><div class="ctrl" style="margin-bottom:16px"><label>Box image</label><p style="font-size:11px;color:#6b7280;margin:6px 0 8px">Preset boxes</p><div id="emoteBoxGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:160px;overflow-y:auto;margin-bottom:10px"></div><div style="display:flex;gap:8px;align-items:center"><label class="upload-box" for="slotBgFile" style="padding:10px;flex:1;margin:0">Upload PNG<input type="file" id="slotBgFile" accept="image/*" style="display:none" onchange="loadFile(this,'slotBg')"/></label><button onclick="clearSlotBg()" style="background:#1a2035;border:1px solid #2a3550;color:#9ca3af;padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;">Clear</button></div></div><div style="border-top:1px solid #1a2035;padding-top:14px;margin-bottom:10px"><p style="font-size:12px;color:#6b7280;margin-bottom:10px">Click an emote to add it as a slot.</p></div><div class="emote-grid" id="emoteGrid"></div><div class="slot-list" id="slotList"></div></div><div class="tab-content" id="tab-background"><div class="ctrl"><label>Background image URL</label><input type="url" id="bgUrl" placeholder="https://..." oninput="loadUrl(this.value,'bg')"/></div><label class="upload-box" for="bgFile" style="margin-bottom:10px">&#128444;&#65039; Upload background<input type="file" id="bgFile" accept="image/*" style="display:none" onchange="loadFile(this,'bg')"/></label><p style="font-size:11px;color:#6b7280;margin:0 0 8px">Preset backgrounds</p><div id="presetBgGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px"></div><div class="ctrl"><label>Blur</label><input type="range" id="bgBlur" min="0" max="30" value="12" oninput="render()"/></div><div class="ctrl"><label>Darkness</label><input type="range" id="bgDark" min="10" max="80" value="40" oninput="render()"/></div><p style="font-size:11px;color:#6b7280;margin:8px 0 6px">Solid color presets</p><div class="bg-grid" id="bgGrid"></div><div class="ctrl" style="margin-top:10px"><label>Custom color</label><input type="color" id="bgColor" value="#0a0e1a" oninput="setBgColor(this.value)"/></div></div></div></div><script src="/web/app.js"></script><script>let imgs={player:null,bg:null,logo:null,slotBg:null};let bgSolid=null;let slots=[];let dragging=null;let maxSlots=2;const EMOTES=[{id:"1467250178703491164",name:"Punch"},{id:"1467250180536533253",name:"Fire Punch"},{id:"1467908903680610477",name:"Kick"},{id:"1467909088678645945",name:"Wet Kick"},{id:"1467908208701210645",name:"Banana"},{id:"1467908387583824017",name:"Golden Banana"},{id:"1467251089689542880",name:"Hug"},{id:"1467251091346292865",name:"Charged Hug"},{id:"1467265174728609814",name:"Ball"},{id:"1467908724948734170",name:"Snowball"},{id:"1467909241024020616",name:"Spatula"},{id:"1467908582488936590",name:"Force Shield"},{id:"1467909565436662043",name:"Lightning"},{id:"1467909759675142310",name:"Invisibility"},{id:"1467265174141669468",name:"MrBeast Case"},{id:"1462862544229372138",name:"Toss a Block"}];const BG_PRESETS=["#ff9a9e","#a1c4fd","#f8c8d4","#ffecd2","#f093fb","#4facfe","#43e97b","#fa709a","#fee140","#30cfd0","#667eea","#f5576c","#4481eb","#0ba360","#f7971e"];function init(){  // Emote boxes ÔÇö carrega automaticamente da pasta /web/assets/emote-boxes/  const emoteBoxGrid = document.getElementById("emoteBoxGrid");  fetch("/web/assets/emote-boxes/list")    .then(r=>r.json())    .then(files=>{      if(!files.length){emoteBoxGrid.innerHTML='<p style="font-size:11px;color:#374151;grid-column:1/-1">Adicione PNGs em web/assets/emote-boxes/</p>';return;}      files.forEach(file=>{        const url=`/web/assets/emote-boxes/${encodeURIComponent(file)}`;        const el=document.createElement("div");        el.title=file.replace(/\.[^.]+$/,"").replace(/_/g," ");        el.style.cssText="aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .15s;";        el.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover;" crossorigin="anonymous" loading="lazy"/>`;        el.onclick=()=>{          document.querySelectorAll("#emoteBoxGrid > div").forEach(x=>x.style.borderColor="transparent");          el.style.borderColor="#3b82f6";          loadUrl(url,"slotBg");        };        emoteBoxGrid.appendChild(el);      });    })    .catch(()=>{emoteBoxGrid.innerHTML='<p style="font-size:11px;color:#374151;grid-column:1/-1">Erro ao carregar.</p>';});  const presetGrid = document.getElementById("presetBgGrid");  fetch("/web/assets/backgrounds/list")    .then(r => r.json())    .then(files => {      if(!files.length){ presetGrid.innerHTML='<p style="font-size:11px;color:#374151;grid-column:1/-1">Nenhum background encontrado.</p>'; return; }      // Campo de busca      const searchWrap = document.createElement("div");      searchWrap.style.cssText = "grid-column:1/-1;margin-bottom:6px;";      searchWrap.innerHTML = '<input id="bgSearch" type="text" placeholder="Buscar background..." style="width:100%;background:#111827;border:1px solid #1a2035;border-radius:8px;padding:7px 10px;color:#fff;font-size:12px;outline:none;"/>';      presetGrid.parentNode.insertBefore(searchWrap, presetGrid);      function renderBgs(filter) {        presetGrid.innerHTML = "";        const filtered = filter ? files.filter(f => f.toLowerCase().includes(filter.toLowerCase())) : files;        if(!filtered.length){ presetGrid.innerHTML='<p style="font-size:11px;color:#374151;grid-column:1/-1">Nenhum resultado.</p>'; return; }        filtered.forEach(file => {          const url = `/web/assets/backgrounds/${encodeURIComponent(file)}`;          const el = document.createElement("div");          el.title = file.replace(/\.[^.]+$/, "").replace(/_/g, " ");          el.style.cssText = "aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:all .15s;position:relative;";          el.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;" crossorigin="anonymous" loading="lazy"/>`;          el.onclick = () => {            document.querySelectorAll("#presetBgGrid > div").forEach(x => x.style.borderColor = "transparent");            el.style.borderColor = "#3b82f6";            bgSolid = null;            imgs.bg = null;            loadUrl(url, "bg");          };          presetGrid.appendChild(el);        });      }      renderBgs("");      document.getElementById("bgSearch").oninput = function(){ renderBgs(this.value); };    })    .catch(() => { presetGrid.innerHTML='<p style="font-size:11px;color:#374151;grid-column:1/-1">Erro ao carregar backgrounds.</p>'; });const eg=document.getElementById("emoteGrid");EMOTES.forEach(e=>{const el=document.createElement("div");el.className="emote-item";el.title=e.name;el.innerHTML=`<img src="https://cdn.discordapp.com/emojis/${e.id}.png" crossorigin="anonymous"/>`;el.onclick=()=>addSlot(e);eg.appendChild(el);});const bg=document.getElementById("bgGrid");BG_PRESETS.forEach(c=>{const el=document.createElement("div");el.className="bg-swatch";el.style.background=c;el.onclick=()=>{setBgColor(c);document.querySelectorAll(".bg-swatch").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");};bg.appendChild(el);});render();}function switchTab(name,btn){document.querySelectorAll(".tab-content").forEach(t=>t.classList.remove("active"));document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));document.getElementById("tab-"+name).classList.add("active");btn.classList.add("active");}function toggleGrad(){const on=document.getElementById("useGrad").checked;document.getElementById("gradOpts").style.display=on?"block":"none";document.getElementById("solidOpts").style.display=on?"none":"block";render();}function loadFile(input,key){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{imgs[key]=img;render();};img.src=e.target.result;};r.readAsDataURL(file);}function loadUrl(url,key){if(!url)return;const img=new Image();img.crossOrigin="anonymous";img.onload=()=>{imgs[key]=img;render();};img.onerror=()=>{};img.src=url;}function setBgColor(c){bgSolid=c;imgs.bg=null;document.getElementById("bgColor").value=c;render();}function addSlot(emote){  if(slots.length>=maxSlots)return;  const slotSz = parseInt(document.getElementById("slotSize").value) || 90;  const gap = 14;  const y = 800 - slotSz/2 - 18;  const x = 18 + slotSz/2 + slots.length * (slotSz + gap);  slots.push({emote, x, y, size: slotSz});  renderSlotList();  render();}function setMaxSlots(n){maxSlots=n;[2,3,4].forEach(v=>{const b=document.getElementById("maxBtn"+v);if(b){b.style.borderColor=v===n?"#3b82f6":"#1a2035";b.style.background=v===n?"rgba(59,130,246,.15)":"#111827";b.style.color=v===n?"#60a5fa":"#6b7280";}});}function clearSlotBg(){imgs.slotBg=null;document.querySelectorAll("#emoteBoxGrid > div").forEach(x=>x.style.borderColor="transparent");render();}function updateSlotSizes(){const sz=parseInt(document.getElementById("slotSize").value)||90;const gap=14;slots.forEach((s,i)=>{s.size=sz;s.x=18+sz/2+i*(sz+gap);s.y=800-sz/2-18;});render();}function removeSlot(i){slots.splice(i,1);renderSlotList();render();}function renderSlotList(){const list=document.getElementById("slotList");list.innerHTML=slots.map((s,i)=>`<div class="slot-item"><img src="https://cdn.discordapp.com/emojis/${s.emote.id}.png" crossorigin="anonymous"/><span>${s.emote.name}</span><button onclick="removeSlot(${i})" style="background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.4);color:#f87171;padding:5px 12px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:700;">Ô£ò</button></div>`).join("");}const canvas=document.getElementById("canvas");canvas.addEventListener("mousedown",e=>{const rect=canvas.getBoundingClientRect();const sc=800/rect.width;const mx=(e.clientX-rect.left)*sc;const my=(e.clientY-rect.top)*sc;for(let i=slots.length-1;i>=0;i--){const s=slots[i];if(Math.abs(mx-s.x)<s.size/2&&Math.abs(my-s.y)<s.size/2){dragging={i,ox:mx-s.x,oy:my-s.y};break;}}});canvas.addEventListener("mousemove",e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();const sc=800/rect.width;slots[dragging.i].x=(e.clientX-rect.left)*sc-dragging.ox;slots[dragging.i].y=(e.clientY-rect.top)*sc-dragging.oy;render();});canvas.addEventListener("mouseup",()=>dragging=null);canvas.addEventListener("mouseleave",()=>dragging=null);function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}function drawText(ctx,text,x,y,font,fill,sc,sw,align,base){align=align||"center";base=base||"top";ctx.save();ctx.font=font;ctx.textAlign=align;ctx.textBaseline=base;if(sw>0){ctx.strokeStyle=sc;ctx.lineWidth=sw*2;ctx.lineJoin="round";ctx.strokeText(text,x,y);}ctx.fillStyle=fill;ctx.fillText(text,x,y);ctx.restore();}function makeGrad(ctx,x,y,w,h,angle,c1,c2){const rad=angle*Math.PI/180,cx=x+w/2,cy=y+h/2,len=Math.sqrt(w*w+h*h)/2;const g=ctx.createLinearGradient(cx+Math.cos(rad+Math.PI)*len,cy+Math.sin(rad+Math.PI)*len,cx+Math.cos(rad)*len,cy+Math.sin(rad)*len);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}function render(){const ctx=canvas.getContext("2d");const W=800,H=800;const name=document.getElementById("dName").value||"";const dSize=parseInt(document.getElementById("dSize").value);const useGrad=document.getElementById("useGrad").checked;const g1=document.getElementById("g1").value;const g2=document.getElementById("g2").value;const gAngle=parseInt(document.getElementById("gAngle").value);const dColor=document.getElementById("dColor").value;const sColor=document.getElementById("sColor").value;const sSize=parseInt(document.getElementById("sSize").value);const discord=document.getElementById("dDiscord").value;const blur=parseInt(document.getElementById("bgBlur").value);const dark=parseInt(document.getElementById("bgDark").value)/100;const pSize=parseInt(document.getElementById("photoSize").value);const pOffY=parseInt(document.getElementById("photoY").value);ctx.clearRect(0,0,W,H);if(imgs.bg){const off=document.createElement("canvas");off.width=W;off.height=H;const octx=off.getContext("2d");octx.filter=`blur(${blur}px)`;const sc=Math.max(W/imgs.bg.width,H/imgs.bg.height);octx.drawImage(imgs.bg,(W-imgs.bg.width*sc)/2,(H-imgs.bg.height*sc)/2,imgs.bg.width*sc,imgs.bg.height*sc);ctx.drawImage(off,0,0);ctx.fillStyle=`rgba(0,0,0,${dark})`;ctx.fillRect(0,0,W,H);}else if(bgSolid){ctx.fillStyle=bgSolid;ctx.fillRect(0,0,W,H);}else{ctx.fillStyle="#0a0e1a";ctx.fillRect(0,0,W,H);}const pX=(W-pSize)/2,pY=(H-pSize)/2+pOffY,pR=48;if(imgs.player){ctx.save();rr(ctx,pX,pY,pSize,pSize,pR);ctx.clip();const sc=Math.max(pSize/imgs.player.width,pSize/imgs.player.height);ctx.drawImage(imgs.player,pX+(pSize-imgs.player.width*sc)/2,pY+(pSize-imgs.player.height*sc)/2,imgs.player.width*sc,imgs.player.height*sc);ctx.restore();ctx.save();rr(ctx,pX,pY,pSize,pSize,pR);ctx.strokeStyle="rgba(255,255,255,0.2)";ctx.lineWidth=3;ctx.stroke();ctx.restore();}else{ctx.save();rr(ctx,pX,pY,pSize,pSize,pR);ctx.fillStyle="rgba(255,255,255,0.08)";ctx.fill();ctx.strokeStyle="rgba(255,255,255,0.15)";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="rgba(255,255,255,0.25)";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("SELECT PHOTO",W/2,H/2+pOffY+20);ctx.restore();}slots.forEach(s=>{const eImg=document.querySelector(`#emoteGrid img[src*="${s.emote.id}"]`);const sz=s.size;const ex=s.x-sz/2,ey=s.y-sz/2;const radPct=parseInt(document.getElementById("slotRadius").value)/100;const rad=sz*radPct;const boxColor=document.getElementById("slotColor").value;function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}function lighten(h,a){const{r,g,b}=hexToRgb(h);return`rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;}function darken(h,a){const{r,g,b}=hexToRgb(h);return`rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;}ctx.save();ctx.shadowColor="rgba(0,0,20,0.85)";ctx.shadowBlur=sz*0.18;ctx.shadowOffsetY=sz*0.06;rr(ctx,ex,ey,sz,sz,rad);if(imgs.slotBg&&imgs.slotBg.complete&&imgs.slotBg.naturalWidth>0){ctx.save();rr(ctx,ex,ey,sz,sz,rad);ctx.clip();const sc=Math.max(sz/imgs.slotBg.width,sz/imgs.slotBg.height);ctx.drawImage(imgs.slotBg,ex+(sz-imgs.slotBg.width*sc)/2,ey+(sz-imgs.slotBg.height*sc)/2,imgs.slotBg.width*sc,imgs.slotBg.height*sc);ctx.restore();}else{const bgGrad=ctx.createLinearGradient(ex,ey,ex,ey+sz);bgGrad.addColorStop(0,lighten(boxColor,20));bgGrad.addColorStop(1,darken(boxColor,20));rr(ctx,ex,ey,sz,sz,rad);ctx.fillStyle=bgGrad;ctx.fill();}ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0;rr(ctx,ex,ey,sz,sz,rad);ctx.strokeStyle="rgba(0,10,40,0.7)";ctx.lineWidth=sz*0.045;ctx.stroke();const hlH=sz*0.18;ctx.save();rr(ctx,ex,ey,sz,sz,rad);ctx.clip();const hlGrad=ctx.createLinearGradient(ex,ey,ex,ey+hlH);hlGrad.addColorStop(0,"rgba(255,255,255,0.55)");hlGrad.addColorStop(1,"rgba(255,255,255,0.0)");ctx.fillStyle=hlGrad;ctx.fillRect(ex,ey,sz,hlH);ctx.restore();ctx.save();rr(ctx,ex,ey,sz,sz,rad);ctx.clip();ctx.strokeStyle="rgba(255,255,255,0.25)";ctx.lineWidth=sz*0.025;ctx.beginPath();ctx.moveTo(ex,ey+hlH);ctx.lineTo(ex+sz,ey+hlH);ctx.stroke();ctx.restore();ctx.restore();if(eImg&&eImg.complete&&eImg.naturalWidth>0){const pad=sz*0.12;ctx.drawImage(eImg,ex+pad,ey+pad,sz-pad*2,sz-pad*2);}});if(name){const font=`${dSize}px 'Lilita One',sans-serif`;ctx.font=font;const tw=ctx.measureText(name).width;let fill;if(useGrad)fill=makeGrad(ctx,W/2-tw/2,36,tw,dSize,gAngle,g1,g2);else fill=dColor;drawText(ctx,name,W/2,36,font,fill,sColor,sSize);}if(imgs.logo){const lSz=72;ctx.save();rr(ctx,18,H-lSz-18,lSz,lSz,12);ctx.clip();ctx.drawImage(imgs.logo,18,H-lSz-18,lSz,lSz);ctx.restore();}if(discord){  const font=`26px 'Lilita One',sans-serif`;  // Tenta desenhar o emoji do Discord antes do texto  const discordEmojiId = "1499523883844370633";  const dEmojiImg = document.querySelector(`img[data-discord-emoji="${discordEmojiId}"]`) ||    (() => {      const img = new Image(); img.crossOrigin="anonymous";      img.dataset.discordEmoji = discordEmojiId;      img.src = `https://cdn.discordapp.com/emojis/${discordEmojiId}.png?size=32`;      document.body.appendChild(img);      img.style.display="none";      img.onload = () => render();      return img;    })();  const eSz = 28;  ctx.font = font;  const tw = ctx.measureText(discord).width;  const totalW = (dEmojiImg && dEmojiImg.complete && dEmojiImg.naturalWidth > 0) ? eSz + 6 + tw : tw;  const startX = W - 18 - totalW;  if(dEmojiImg && dEmojiImg.complete && dEmojiImg.naturalWidth > 0){    ctx.drawImage(dEmojiImg, startX, H - 18 - eSz, eSz, eSz);    drawText(ctx, discord, startX + eSz + 6, H - 18, font, dColor, sColor, sSize*0.6, "left", "bottom");  } else {    drawText(ctx, discord, W-18, H-18, font, dColor, sColor, sSize*0.6, "right", "bottom");  }}// ÔöÇÔöÇ Map + Mode below photo ÔöÇÔöÇconst dMap = document.getElementById("dMap").value;const dMode = document.getElementById("dMode").value;if(dMap || dMode){  const mapColor = document.getElementById("dMapColor").value;  const mapStroke = parseInt(document.getElementById("dMapStroke").value);  const mapFontSz = parseInt(document.getElementById("dMapSize").value);  const modeFontSz = parseInt(document.getElementById("dModeSize").value);  const mapFont = `900 ${mapFontSz}px 'Lilita One',sans-serif`;  const modeFont = `900 ${modeFontSz}px 'Lilita One',sans-serif`;  const belowY = pY + pSize + 36;  if(dMap) drawText(ctx, dMap, W/2, belowY, mapFont, mapColor, sColor, mapStroke);  if(dMode) drawText(ctx, dMode, W/2, belowY + (dMap ? mapFontSz + 8 : 0), modeFont, mapColor, sColor, mapStroke * 0.8);}}function download(){const name=document.getElementById("dName").value||"card";const a=document.createElement("a");a.download=`${name.replace(/\s+/g,"-")}.png`;a.href=canvas.toDataURL("image/png");a.click();}function saveToInventory(){  const name=document.getElementById("dName").value||"card";  const token=getToken();  if(!token){toast("Login required","error");return;}  // Tenta toDataURL ÔÇö pode falhar se canvas estiver contaminado por CORS  let imageData;  try {    imageData = canvas.toDataURL("image/png");  } catch(e) {    // Canvas contaminado: re-renderiza sem imagens externas e tenta de novo    toast("Saving...","success");    const tempCanvas = document.createElement("canvas");    tempCanvas.width = 800; tempCanvas.height = 800;    const tctx = tempCanvas.getContext("2d");    tctx.drawImage(canvas, 0, 0);    try { imageData = tempCanvas.toDataURL("image/png"); }    catch(e2) { toast("Cannot save: canvas blocked by CORS images","error"); return; }  }  fetch("/web/inventory",{    method:"POST",    headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},    body:JSON.stringify({name,imageData})  })  .then(async r=>{    const d = await r.json();    if(!r.ok || d.error) toast("Error: "+(d.error||r.status),"error");    else toast("Saved to inventory!","success");  })  .catch(e=>toast("Error: "+e.message,"error"));}init();</script></body></html>
