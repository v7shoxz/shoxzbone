<!DOCTYPE html><html lang="pt-BR"><head>  <meta charset="UTF-8"/>  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>  <title>Inventory — Tournament X</title>  <link rel="stylesheet" href="/web/style.css"/><link rel="stylesheet" href="/web/animations.css"/>  <link rel="stylesheet" href="/web/dashboard.css"/>  <style>    .inv-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; padding:24px; }    .inv-card { background:#0d1117; border:1px solid #1a2035; border-radius:14px; overflow:hidden; position:relative; }    .inv-card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }    .inv-card-info { padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }    .inv-card-name { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }    .inv-card-date { font-size:11px; color:#4b5563; white-space:nowrap; }    .inv-card-del { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.2); color:#f87171; padding:4px 10px; border-radius:6px; font-size:11px; cursor:pointer; }    .inv-card-del:hover { background:rgba(239,68,68,.3); }    .inv-empty { text-align:center; padding:80px 24px; color:#4b5563; }    .inv-empty p { margin-top:8px; font-size:14px; }    .inv-header { padding:24px 24px 0; display:flex; align-items:center; justify-content:space-between; }    .inv-title { font-size:22px; font-weight:900; color:#fff; }    .inv-count { font-size:13px; color:#6b7280; }  </style></head><body class="dash-body">  <aside class="sidebar" id="sidebar">    <div class="sidebar-logo"><a href="/" class="logo">Tournament <span class="badge">X</span></a></div>    <nav class="sidebar-nav">      <a href="/web/dashboard.html" class="sidebar-item">        <span class="sidebar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span> Dashboard      </a>      <a href="/web/create.html" class="sidebar-item">        <span class="sidebar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span> <span style="color:#34d399">Create Tournament</span>      </a>      <a href="/web/card-generator.html" class="sidebar-item">        <span class="sidebar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span> <span style="color:#a78bfa">Card Generator</span>      </a>      <a href="/web/inventory.html" class="sidebar-item active">        <span class="sidebar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span> <span style="color:#f59e0b">Inventory</span>      </a>    </nav>    <div class="sidebar-bottom">      <button class="sidebar-item danger" onclick="logout()"><span class="sidebar-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></span> Sign Out</button>    </div>  </aside>  <div class="create-main">    <header class="topbar">      <button class="topbar-menu" onclick="toggleSidebar()">☰</button>      <div class="topbar-right">        <div class="topbar-credits">💰 <span id="topbarCredits">0</span> Credits</div>        <div class="topbar-avatar"><img id="topbarAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png"/></div>      </div>    </header>    <div class="inv-header">      <div>        <div class="page-label">MY CARDS</div>        <div class="inv-title">Inventory</div>      </div>      <span class="inv-count" id="invCount"></span>    </div>    <div id="invGrid" class="inv-grid"></div>  </div>  <div id="toast" class="toast"></div>  <script src="/web/app.js"></script>  <script>    if (!getToken()) window.location.href = "/web/login.html";    (async function(){const r=await apiFetch("/web/auth/me");if(!r||r.status===401){clearAuth();window.location.href="/web/login.html";}})();    const user = getUser();    if (user) {      document.getElementById("topbarCredits").textContent = user.credits?.toLocaleString() || 0;      document.getElementById("topbarAvatar").src = user.avatar || "https://cdn.discordapp.com/embed/avatars/0.png";    }    async function loadInventory() {      const res = await apiFetch("/web/inventory");      if (!res) return;      const data = await res.json();      const cards = Array.isArray(data) ? data : [];      const grid = document.getElementById("invGrid");      document.getElementById("invCount").textContent = `${cards.length}/20 cards`;      if (cards.length === 0) {        grid.innerHTML = `<div class="inv-empty" style="grid-column:1/-1">          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.5"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>          <p>No cards saved yet. Go to <a href="/web/card-generator.html" style="color:#a78bfa">Card Generator</a> and save your first card!</p>        </div>`;        return;      }      grid.innerHTML = cards.map(c => `        <div class="inv-card" id="card-${c._id}">          <img src="/web/inventory/${c._id}/image" alt="${c.name}" loading="lazy"/>          <div class="inv-card-info">            <span class="inv-card-name" title="${c.name}">${c.name}</span>            <span class="inv-card-date">${new Date(c.createdAt).toLocaleDateString("pt-BR")}</span>            <button class="inv-card-del" onclick="deleteCard('${c._id}')">✕</button>          </div>        </div>`).join("");    }    async function deleteCard(id) {      if (!confirm("Delete this card?")) return;      const res = await apiFetch(`/web/inventory/${id}`, { method: "DELETE" });      if (!res) return;      const d = await res.json();      if (d.ok) {        document.getElementById("card-" + id)?.remove();        toast("Card deleted", "success");        loadInventory();      } else {        toast(d.error || "Error", "error");      }    }    loadInventory();  </script></body></html>
