<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aguardando aprovação</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0e1a; display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .box {
      background: #0f1525; border: 1px solid #1e2d4a;
      border-radius: 12px; padding: 40px 36px; width: 360px; text-align: center;
    }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; display: block; background: #1e2d4a; }
    h2 { color: #e0e8ff; font-size: 18px; margin-bottom: 6px; }
    .sub { color: #7a90b8; font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #1e2d4a;
      border-top-color: #2196f3; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #7a90b8; }
    .denied { color: #ef5350; font-size: 14px; margin-top: 12px; }
    .btn { display: inline-block; margin-top: 16px; background: #1565c0; color: #fff; border: none; border-radius: 8px; padding: 9px 20px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <img id="avatar" class="avatar" src="" alt="" />
    <h2 id="username">Carregando...</h2>
    <p class="sub">Sua solicitação foi enviada. Aguarde o administrador aprovar seu acesso.</p>
    <div id="spinner" class="spinner"></div>
    <p class="status" id="status-text">Verificando status...</p>
    <div id="denied-msg" class="denied" style="display:none">Acesso negado. Entre em contato com o administrador.</div>
    <a href="/dashboard/login.html" class="btn" id="back-btn" style="display:none">Voltar</a>
  </div>

  <script>
    const token = new URLSearchParams(location.search).get("token");
    if (!token) location.href = "/dashboard/login.html";

    async function poll() {
      try {
        const res = await fetch(`/auth/status?token=${token}`);
        const data = await res.json();

        document.getElementById("avatar").src = data.discordAvatar || "";
        document.getElementById("username").textContent = data.discordUsername || "Usuário";

        if (data.status === "approved") {
          localStorage.setItem("dashToken", token);
          localStorage.setItem("discordAvatar", data.discordAvatar);
          localStorage.setItem("discordUsername", data.discordUsername);
          location.href = "/dashboard/";
        } else if (data.status === "denied") {
          document.getElementById("spinner").style.display = "none";
          document.getElementById("status-text").style.display = "none";
          document.getElementById("denied-msg").style.display = "block";
          document.getElementById("back-btn").style.display = "inline-block";
        } else {
          document.getElementById("status-text").textContent = "Aguardando aprovação...";
          setTimeout(poll, 3000);
        }
      } catch {
        setTimeout(poll, 5000);
      }
    }

    poll();
  </script>
</body>
</html>
