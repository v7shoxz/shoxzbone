<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tournament Hub — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0e1a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .box {
      background: #0f1525;
      border: 1px solid #1e2d4a;
      border-radius: 12px;
      padding: 40px 36px;
      width: 360px;
      text-align: center;
    }
    .logo { font-size: 28px; margin-bottom: 6px; }
    h2 { color: #42a5f5; font-size: 20px; margin-bottom: 6px; }
    .sub { color: #7a90b8; font-size: 13px; margin-bottom: 28px; line-height: 1.5; }
    .btn-discord {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; background: #5865f2; color: #fff;
      border: none; border-radius: 8px; padding: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: background 0.15s;
    }
    .btn-discord:hover { background: #4752c4; }
    .btn-discord svg { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }
    .err { color: #ef5350; font-size: 12px; margin-top: 14px; }
    .divider { border: none; border-top: 1px solid #1e2d4a; margin: 24px 0; }
    .admin-section { text-align: left; }
    .admin-section label { font-size: 11px; color: #7a90b8; display: block; margin-bottom: 6px; }
    .admin-section input {
      width: 100%; background: #151d30; border: 1px solid #1e2d4a;
      border-radius: 8px; padding: 9px 12px; color: #e0e8ff;
      font-size: 13px; outline: none; margin-bottom: 8px;
    }
    .admin-section input:focus { border-color: #2196f3; }
    .btn-admin {
      width: 100%; background: #1565c0; color: #fff;
      border: none; border-radius: 8px; padding: 9px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-admin:hover { background: #1976d2; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">★</div>
    <h2>Tournament Hub</h2>
    <p class="sub">Faça login com Discord para solicitar acesso ao painel de torneios.</p>

    <a class="btn-discord" href="/auth/discord">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
      </svg>
      Entrar com Discord
    </a>

    <div id="err-msg" class="err" style="display:none"></div>

    <hr class="divider" />

    <div class="admin-section">
      <label>Acesso admin direto</label>
      <input id="admin-key" type="password" placeholder="Chave de admin..." />
      <button class="btn-admin" onclick="adminLogin()">Entrar como Admin</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const err = params.get("err");
    if (err) {
      const el = document.getElementById("err-msg");
      el.style.display = "block";
      el.textContent = err === "denied" ? "Acesso negado pelo administrador." : "Erro ao autenticar. Tente novamente.";
    }

    function adminLogin() {
      const key = document.getElementById("admin-key").value.trim();
      if (key) window.location.href = "/dashboard/?key=" + encodeURIComponent(key);
    }
    document.getElementById("admin-key").addEventListener("keydown", (e) => {
      if (e.key === "Enter") adminLogin();
    });
  </script>
</body>
</html>
